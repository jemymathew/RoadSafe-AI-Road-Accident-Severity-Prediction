services:
  backend:
    image: jemymathew/roadsafe-backend:latest
    container_name: roadsafe-backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

  frontend:
    image: jemymathew/roadsafe-frontend:latest
    container_name: roadsafe-frontend
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend